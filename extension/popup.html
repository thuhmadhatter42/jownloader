<!doctype html>
<html><head><meta charset="utf-8"><title>Jownloader</title>
<style>
  body { width: 300px; box-sizing: border-box; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #eee; background: #1c1c1e; }
  body.panel { width: auto; min-height: 100vh; }
  h1 { font-size: 14px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
  h1 button { width: auto; margin: 0; padding: 3px 8px; font: 12px system-ui; background: #2a2a2d; border: 1px solid #444; color: #ccc; }
  body.panel h1 button { display: none; }
  .host { color: #999; font-size: 12px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { display: block; width: 100%; margin: 6px 0; padding: 9px; font: 600 13px system-ui; color: #fff; background: #2f6fed; border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { background: #444; color: #888; cursor: default; }
  [hidden] { display: none !important; }   /* button { display: block } above would otherwise beat the attribute */
  label { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #333; }
  label span small { display: block; color: #888; font-weight: normal; }
  label select { font: 12px system-ui; color: #eee; background: #2a2a2d; border: 1px solid #444; border-radius: 6px; padding: 4px 6px; }
  .row { display: flex; gap: 6px; margin-bottom: 4px; }
  .row input { flex: 1; min-width: 0; padding: 7px 8px; font: 12px system-ui; color: #eee; background: #2a2a2d; border: 1px solid #444; border-radius: 6px; }
  .row input::placeholder { color: #777; }
  .row .dest { margin: 0; padding: 7px 8px; font: 12px system-ui; text-align: left; color: #eee; background: #2a2a2d; border: 1px solid #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button:not(.x):not(.dest) { flex: 1; margin: 0; }
  .row .x { margin: 0; width: 32px; flex: none; padding: 7px 0; background: #2a2a2d; border: 1px solid #444; color: #ccc; }
  .foot { text-align: right; margin-top: 4px; }
  .link { display: inline; width: auto; margin: 0; padding: 2px 4px; font: 11px system-ui; color: #888; background: none; text-decoration: underline; }
  .status { color: #9f9; min-height: 16px; margin-top: 6px; font-size: 12px; white-space: pre-line; }
  .warn { color: #fc6; }
  .bar { height: 8px; margin-top: 8px; background: #2a2a2d; border: 1px solid #444; border-radius: 5px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #2f6fed; transition: width .15s linear; }
  .tabs { display: flex; gap: 4px; margin: 0 0 8px; border-bottom: 1px solid #333; }
  .tabs button { width: auto; flex: 1; margin: 0; padding: 6px; font: 600 12px system-ui; color: #999; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; }
  .tabs button.on { color: #fff; border-bottom-color: #2f6fed; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 0; justify-content: flex-start; }
  .opt input[type=radio] { margin: 0 4px 0 0; }
  .files { color: #999; font-size: 12px; margin: 4px 0; }
</style></head>
<body>
  <h1>Jownloader <button id="sidebar" title="open Jownloader as a sidebar that stays open while you browse">⧉ sidebar</button></h1>
  <div class="tabs"><button id="tabDl" class="on">Download</button><button id="tabRn">Batch</button></div>
  <div id="paneDl">
  <div class="host" id="host">scanning…</div>
  <div class="row"><button id="dest" class="dest" title="Downloads">📁 Downloads</button><button id="destClear" class="x" title="back to Downloads" hidden>×</button></div>
  <div class="row"><input id="prefix" placeholder="name → name_1, _2… ([yy-mm-dd] = upload date)"></div>
  <button id="site" hidden>Download from this page</button>
  <button id="siteAudio" hidden title="best audio as MP3, BPM and key detected and put in the name">Audio only → MP3 + BPM/key</button>
  <div class="row"><input id="sitePages" type="number" min="1" value="50" title="max pages to crawl" style="width:56px;flex:none"><button id="sitePdf" hidden style="flex:1">Save site as PDF</button></div>
  <button id="siteMd" hidden>Save site as Markdown</button>
  <button id="imgs" disabled>Download all images</button>
  <button id="vids" disabled>Download all videos</button>
  <button id="docs" disabled>Download all documents</button>
  <div class="row"><button id="coll" disabled>Download collected (0)</button><button id="collClear" class="x" title="forget the collected list" hidden>×</button></div>
  <label><span>Collect as I scroll<small>every picture shown ≥ 300 px on screen is remembered; thumbnails aren't</small></span><input type="checkbox" id="collect"></label>
  <label><span>Auto-download every video<small>on every page, as they appear or play</small></span><input type="checkbox" id="autoVideos"></label>
  <label><span>Button on videos<small>⬇ overlay top-left of every player, shows the quality it will grab</small></span><input type="checkbox" id="showButton"></label>
  <label><span>Strip metadata<small>EXIF, GPS, XMP and the rest removed from every file saved</small></span><input type="checkbox" id="strip"></label>
  <label><span>Convert WebP<small>every .webp saved becomes a .jpg (quality 100) or a .png</small></span><select id="webp"><option value="">keep</option><option value="jpg">JPEG</option><option value="png">PNG</option></select></label>
  <div class="foot"><button id="forget" class="link" title="every URL saved so far is skipped while its file is still in its folder; this wipes that memory">forget saved (0)</button></div>
  </div>
  <div id="paneRn" hidden>
  <div class="row"><input id="rnName" placeholder="name → name_1, _2… ([yy-mm-dd] = file date)"></div>
  <div class="row"><button id="rnPick">Select files…</button><button id="rnClear" class="x" title="forget the selected files" hidden>×</button></div>
  <div class="files" id="rnFiles">no files selected</div>
  <label class="opt"><input type="checkbox" id="rnMove"><span>Move the files?</span></label>
  <div class="row"><button id="rnDest" class="dest" disabled title="choose a folder">📁 destination</button><button id="rnDestClear" class="x" title="clear the destination" hidden>×</button></div>
  <div class="opt"><label class="opt"><input type="radio" name="rnMode" value="move" checked disabled>move</label><label class="opt"><input type="radio" name="rnMode" value="copy" disabled>copy</label></div>
  <button id="rnGo" disabled>Rename</button>
  <div class="row"><button id="rnStrip" disabled title="remove all metadata from the selected files, in place">Strip metadata</button><button id="rnWebp" disabled title="convert the selected .webp files to .jpg (originals removed)">WebP → JPEG</button><button id="rnPng" disabled title="convert the selected .webp files to .png (originals removed)">WebP → PNG</button></div>
  </div>
  <div class="bar" id="bar" hidden><div id="fill"></div></div>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body></html>
