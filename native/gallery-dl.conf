{
    "extractor": {
        "base-directory": "~/Downloads",
        "instagram": {
            "directory": [
                "{user[username]|username}"
            ],
            "filename": "\fE ((locals().get('user') or {}).get('username') or username) + '-' + date.strftime('%b-%d-%y').lower() + '-%02d' % num + '.' + extension",
            "include": [
                "posts",
                "reels",
                "highlights",
                "avatar"
            ],
            "videos": true,
            "sleep-request": [
                6.0,
                12.0
            ],
            "avatar": {
                "directory": [
                    "{user[username]|username}",
                    "avatar"
                ],
                "filename": "\fE ((locals().get('user') or {}).get('username') or username) + '-avatar.' + extension"
            },
            "highlights": {
                "directory": [
                    "{user[username]|username}",
                    "highlights"
                ]
            },
            "stories": {
                "directory": [
                    "{user[username]|username}",
                    "stories"
                ]
            },
            "tagged": {
                "directory": [
                    "{user[username]|username}",
                    "tagged"
                ]
            },
            "archive": "~/Downloads/.jownloader-archive.sqlite3",
            "skip": "enumerate"
        },
        "twitter": {
            "directory": [
                "{author[name]}"
            ],
            "filename": "{tweet_id}_{num}.{extension}",
            "videos": true,
            "retweets": false,
            "archive": "~/Downloads/.jownloader-archive.sqlite3",
            "skip": "enumerate"
        }
    },
    "downloader": {
        "part": false,
        "progress": null,
        "ytdl": {
            "format": "bv*[vcodec^=avc1]+ba/bv*+ba/b[vcodec^=avc1]/b"
        }
    },
    "output": {
        "progress": false
    }
}